[tools]
node = "24.20.0"
rclone = "1.75.0"
uv = "0.12.8"

[tasks.setup]
description = "Install the JavaScript and Python dependencies"
run = ["npm ci", "uv sync --locked"]

[tasks.dev]
description = "Start the Astro development server"
run = "npm run dev"

[tasks.hydrate]
description = "Copy selected gallery sources from the NAS into local data"
run = "uv run python cli.py hydrate"

[tasks.produce]
description = "Build public photo renditions and generated gallery metadata"
run = "uv run python cli.py parse-and-produce"

[tasks.check]
description = "Check the Python tools and Astro application"
run = [
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run python -m pytest -q",
  "npm run check",
  "npm run build",
]

[tasks.catalog-scan]
description = "Refresh the local SQLite catalog from NAS edits folders"
run = "uv run python cli.py catalog scan"

[tasks.catalog-serve]
description = "Serve the local photo catalog browser"
run = "uv run python cli.py catalog serve"
